<!doctype html>
<!--
  Home Assistant OAuth client page for Domo.
  Host it at the URL of `HomeAssistantAuth.clientID`: Home Assistant fetches it during sign-in and
  only accepts the redirect URIs declared below (the app uses a custom scheme, domo://).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Domo</title>
  <link rel="redirect_uri" href="domo://ha-auth">
</head>
<body>
  <h1>Domo</h1>
  <p>Tableau de bord domotique pour iPad.</p>
</body>
</html>
